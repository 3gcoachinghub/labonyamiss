<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3AC099"/>
      <stop offset="100%" stop-color="#1E8E6C"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#E05600"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Box with Teal Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="#FFFFFF" stroke="url(#tealGrad)" stroke-width="36"/>
  
  <!-- Central Emblem -->
  <g transform="translate(106, 92)">
    <!-- 4 Orange Bar Pillars -->
    <!-- Pillar 1 (Left Outer) -->
    <rect x="0" y="0" width="42" height="114" rx="4" fill="url(#orangeGrad)"/>
    <!-- Pillar 2 (Left Inner Long) -->
    <rect x="86" y="0" width="42" height="230" rx="4" fill="url(#orangeGrad)"/>
    <!-- Pillar 3 (Right Inner Long) -->
    <rect x="172" y="0" width="42" height="230" rx="4" fill="url(#orangeGrad)"/>
    <!-- Pillar 4 (Right Outer) -->
    <rect x="258" y="0" width="42" height="114" rx="4" fill="url(#orangeGrad)"/>

    <!-- Green Base U-Frame -->
    <!-- Left Arm -->
    <rect x="0" y="146" width="42" height="158" rx="4" fill="url(#tealGrad)"/>
    <!-- Right Arm -->
    <rect x="258" y="146" width="42" height="158" rx="4" fill="url(#tealGrad)"/>
    <!-- Bottom Connecting Bar -->
    <rect x="0" y="252" width="300" height="52" rx="4" fill="url(#tealGrad)"/>
  </g>
</svg>
