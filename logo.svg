<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tealFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65c8ad"/>
      <stop offset="1" stop-color="#159a78"/>
    </linearGradient>
    <linearGradient id="tealBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62c6aa"/>
      <stop offset="1" stop-color="#1c9878"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb65e"/>
      <stop offset="1" stop-color="#f28b28"/>
    </linearGradient>
  </defs>

  <!-- White canvas with padding -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Logo frame -->
  <rect x="40" y="40" width="432" height="432" rx="78"
        fill="none" stroke="url(#tealFrame)" stroke-width="28"/>

  <!-- Symbol -->
  <g transform="translate(0,10)">
    <!-- U base -->
    <path d="M128 235 V350 H384 V235 H350 V315 H162 V235 Z"
          fill="url(#tealBase)"/>

    <!-- Orange bars -->
    <rect x="128" y="110" width="38" height="120" fill="url(#orange)"/>
    <rect x="205" y="110" width="38" height="205" fill="url(#orange)"/>
    <rect x="269" y="110" width="38" height="205" fill="url(#orange)"/>
    <rect x="346" y="110" width="38" height="120" fill="url(#orange)"/>
  </g>
</svg>